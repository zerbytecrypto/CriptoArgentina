<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ingresar — Cripto Argentina</title>
<style>
  :root{
    --celeste:#74ACDF; --celeste-dark:#4A8BC2; --celeste-deep:#2C5F8A;
    --sun:#F6B40E; --sun-dark:#C98A05; --white:#fff;
    --ink:#0F2136; --ink-soft:#3E5A75; --ice:#EAF3FB; --line:#C9DDF0;
    --radius:14px; --shadow:0 10px 30px rgba(15,33,54,.10);
    --danger:#B3261E;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:'Segoe UI',system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;
    color:var(--ink); line-height:1.6; min-height:100vh;
    display:grid; place-items:center; padding:2rem 1rem;
    background:linear-gradient(180deg,var(--celeste) 0%,var(--ice) 55%,var(--white) 100%);
  }
  .brand{
    display:flex;align-items:center;gap:.6rem;justify-content:center;
    font-weight:800;margin-bottom:1.4rem;text-decoration:none;color:var(--ink);
  }
  .logo-mark{
    width:32px;height:32px;border-radius:50%;
    background:radial-gradient(circle at 50% 45%,var(--sun) 0 38%,var(--celeste-dark) 39% 100%);
    box-shadow:inset 0 0 0 3px var(--white),0 2px 8px rgba(116,172,223,.5);
  }
  .sun{
    width:64px;height:64px;margin:0 auto 1.2rem;border-radius:50%;
    background:radial-gradient(circle at 50% 50%,#FFD968 0 30%,var(--sun) 60%,var(--sun-dark) 100%);
    box-shadow:0 0 0 7px rgba(246,180,14,.22),0 0 0 16px rgba(246,180,14,.10);
  }
  .panel{
    width:min(430px,100%);background:var(--white);border:1px solid var(--line);
    border-radius:var(--radius);box-shadow:var(--shadow);padding:2rem;
  }
  h1{font-size:1.45rem;letter-spacing:-.02em;text-align:center;margin-bottom:.35rem}
  .sub{text-align:center;color:var(--ink-soft);font-size:.9rem;margin-bottom:1.5rem}
  .tabs{display:flex;background:var(--ice);border-radius:999px;padding:4px;margin-bottom:1.5rem}
  .tabs button{
    flex:1;border:none;background:none;font:inherit;font-weight:700;font-size:.9rem;
    padding:.55rem;border-radius:999px;cursor:pointer;color:var(--ink-soft);
    transition:background .18s,color .18s;
  }
  .tabs button.active{background:var(--white);color:var(--celeste-deep);box-shadow:0 2px 8px rgba(15,33,54,.09)}
  .field{margin-bottom:1rem}
  label{display:block;font-size:.8rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-soft);margin-bottom:.4rem}
  input{
    width:100%;padding:.8rem 1rem;border-radius:10px;border:1px solid var(--line);
    background:var(--white);color:var(--ink);font:inherit;transition:border-color .18s,box-shadow .18s;
  }
  input:focus{outline:none;border-color:var(--celeste);box-shadow:0 0 0 3px rgba(116,172,223,.3)}
  .btn{
    width:100%;border:none;cursor:pointer;font:inherit;font-weight:700;
    border-radius:999px;padding:.85rem;margin-top:.5rem;
    background:linear-gradient(135deg,var(--celeste),var(--celeste-dark));
    color:var(--white);box-shadow:0 6px 18px rgba(74,139,194,.4);
    transition:transform .15s,opacity .18s;
  }
  .btn:hover{transform:translateY(-2px)}
  .btn:disabled{opacity:.6;cursor:progress;transform:none}
  .msg{margin-top:1rem;padding:.75rem 1rem;border-radius:10px;font-size:.88rem;display:none}
  .msg.show{display:block}
  .msg.err{background:#FDECEA;color:var(--danger);border:1px solid #F5C2BD}
  .msg.ok{background:#E8F5EE;color:#137A4B;border:1px solid #B7E0CB}
  .hint{text-align:center;font-size:.83rem;color:var(--ink-soft);margin-top:1.3rem}
  .hint a{color:var(--celeste-deep);font-weight:600;text-decoration:none}
  .hidden{display:none !important}
</style>
</head>
<body>
<main class="panel">
  <a href="index.html" class="brand"><span class="logo-mark"></span>Cripto Argentina</a>
  <div class="sun"></div>
  <h1 id="title">Ingresá a tu cuenta</h1>
  <p class="sub" id="subtitle">Operá en spot y futuros desde un solo lugar.</p>

  <div class="tabs">
    <button id="tabLogin" class="active">Ingresar</button>
    <button id="tabSignup">Crear cuenta</button>
  </div>

  <form id="form">
    <div class="field hidden" id="wrapName">
      <label for="fullName">Nombre completo</label>
      <input type="text" id="fullName" autocomplete="name" placeholder="Ana Gómez">
    </div>
    <div class="field hidden" id="wrapCuit">
      <label for="cuit">CUIT</label>
      <input type="text" id="cuit" inputmode="numeric" placeholder="20-12345678-9">
    </div>
    <div class="field">
      <label for="email">Email</label>
      <input type="email" id="email" autocomplete="email" required placeholder="tu@email.com">
    </div>
    <div class="field">
      <label for="password">Contraseña</label>
      <input type="password" id="password" autocomplete="current-password" required minlength="6" placeholder="Mínimo 6 caracteres">
    </div>
    <button class="btn" id="submitBtn" type="submit">Ingresar</button>
  </form>

  <div class="msg" id="msg"></div>
  <p class="hint"><a href="index.html">← Volver al inicio</a></p>
</main>

<script type="module">
import { supabase } from './shared.js';

const $ = id => document.getElementById(id);
let mode = 'login';

function setMode(next){
  mode = next;
  const signup = next === 'signup';
  $('tabLogin').classList.toggle('active', !signup);
  $('tabSignup').classList.toggle('active', signup);
  $('wrapName').classList.toggle('hidden', !signup);
  $('wrapCuit').classList.toggle('hidden', !signup);
  $('password').setAttribute('autocomplete', signup ? 'new-password' : 'current-password');
  $('title').textContent    = signup ? 'Creá tu cuenta' : 'Ingresá a tu cuenta';
  $('subtitle').textContent = signup ? 'Tarda menos de un minuto.' : 'Operá en spot y futuros desde un solo lugar.';
  $('submitBtn').textContent = signup ? 'Crear cuenta' : 'Ingresar';
  hide();
}

function show(text, kind = 'err'){
  const el = $('msg');
  el.textContent = text;
  el.className = 'msg show ' + kind;
}
function hide(){ $('msg').className = 'msg'; }

$('tabLogin').onclick  = () => setMode('login');
$('tabSignup').onclick = () => setMode('signup');

$('form').addEventListener('submit', async e => {
  e.preventDefault();
  hide();
  const btn = $('submitBtn');
  btn.disabled = true;

  const email = $('email').value.trim();
  const password = $('password').value;

  try {
    if (mode === 'signup') {
      const { data, error } = await supabase.auth.signUp({
        email, password,
        options: {
          data: {
            full_name: $('fullName').value.trim(),
            cuit: $('cuit').value.trim()
          }
        }
      });
      if (error) throw error;

      // si hay sesión, ya está confirmado y entra directo
      if (data.session) { location.href = 'dashboard.html'; return; }
      show('Cuenta creada. Revisá tu email para confirmar la dirección.', 'ok');
      setMode('login');
    } else {
      const { error } = await supabase.auth.signInWithPassword({ email, password });
      if (error) throw error;
      location.href = 'dashboard.html';
    }
  } catch (err) {
    show(err.message || 'Algo salió mal. Probá de nuevo.');
  } finally {
    btn.disabled = false;
  }
});

// Ya logueado → directo al dashboard
supabase.auth.getSession().then(({ data: { session } }) => {
  if (session) location.href = 'dashboard.html';
});

  // al final de login.html, después de setMode()
if (new URLSearchParams(location.search).get('mode') === 'signup') setMode('signup');

</script>
</body>
</html>
